<!doctype html><meta charset="utf-8"><title>ChronoLens Physics Tests</title><style>body{font:16px system-ui;background:#07101a;color:#e9f8ff;padding:32px}li{margin:8px 0}.ok{color:#76efb2}.bad{color:#ff7890}</style><h1>ChronoLens Physics Validation</h1><ul id="out"></ul><script>const out=document.querySelector('#out'),tests=[];function near(a,b,e=1e-6){return Math.abs(a-b)<e}function gamma(b){return 1/Math.sqrt(1-b*b)}function rel(u,v){return (u-v)/(1-u*v)}function grav(R){return Math.sqrt(1-1/R)}function doppler(b){return Math.sqrt((1+b)/(1-b))}tests.push(['γ(0)=1',near(gamma(0),1)],['γ(0.6)=1.25',near(gamma(.6),1.25)],['γ(0.8)=1.6667',near(gamma(.8),5/3)],['0.9c proper-time factor',near(1/gamma(.9),Math.sqrt(.19))],['relative velocity 0.9c vs -0.9c < c',Math.abs(rel(.9,-.9))<1],['Schwarzschild factor at 2rs = sqrt(1/2)',near(grav(2),Math.SQRT1_2)],['gravitational clock tends to zero at horizon',near(grav(1),0)],['Doppler factor at rest = 1',near(doppler(0),1)]);tests.forEach(([n,p])=>{let li=document.createElement('li');li.className=p?'ok':'bad';li.textContent=(p?'PASS — ':'FAIL — ')+n;out.appendChild(li)});document.body.dataset.result=tests.every(x=>x[1])?'pass':'fail';</script>
